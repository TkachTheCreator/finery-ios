# /etc/nginx/sites-available/finery.conf
# Serves finery.pro/privacy and finery.pro/terms as static HTML pages.
# SSL is terminated by Cloudflare (proxy mode) — server listens HTTP only.

server {
    listen 80;
    server_name finery.pro www.finery.pro;

    root /var/www/finery/static;
    charset utf-8;

    # finery.pro/privacy → privacy.html
    location = /privacy {
        try_files /privacy.html =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # finery.pro/terms → terms.html
    location = /terms {
        try_files /terms.html =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Redirect bare root to App Store / landing (adjust URL when ready)
    location = / {
        return 302 https://apps.apple.com;
    }

    # Block everything else on this domain
    location / {
        return 404;
    }
}
