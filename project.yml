name: Finery
options:
  bundleIdPrefix: com.tkachev
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

packages:
  Pow:
    url: https://github.com/EmergeTools/Pow
    from: "1.0.0"
  Lottie:
    url: https://github.com/airbnb/lottie-spm.git
    from: "4.5.0"
  Shimmer:
    url: https://github.com/markiv/SwiftUI-Shimmer.git
    from: "1.5.0"

targets:
  Finery:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Finery
        excludes:
          - Info.plist
    info:
      path: Finery/Info.plist
      properties:
        CFBundleDisplayName: Finery
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: "Finery использует микрофон для голосового ввода транзакций"
        NSSpeechRecognitionUsageDescription: "Finery распознаёт речь чтобы автоматически заполнять поля транзакции"
        NSUserNotificationsUsageDescription: "Finery отправляет напоминания о налоговых дедлайнах"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
    dependencies:
      - package: Pow
        product: Pow
      - package: Lottie
        product: Lottie
      - package: Shimmer
        product: Shimmer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tkachev.finery
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "iPhone Developer"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          DEBUG_INFORMATION_FORMAT: dwarf
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"

  FineryTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FineryTests
    dependencies:
      - target: Finery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tkachev.finery.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Finery.app/Finery"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
